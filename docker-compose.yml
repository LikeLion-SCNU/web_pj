version: '3.8'
services:
  web:
    build: .
    image: scnu-likelion:latest
    container_name: scnu-likelion
    ports:
      - "8888:80"
    depends_on:
      - api
    restart: always
    networks:
      - frontend

  api:
    build: ./api
    container_name: scnu-likelion-api
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    container_name: scnu-likelion-db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - backend

volumes:
  pgdata:
  uploads:

networks:
  frontend:
  backend:
