<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미션 제출 - SCNU LIKELION PBL</title>
  <link rel="icon" type="image/png" href="../images/logo_og.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/pbl.css">
</head>
<body>

  <header class="pbl-header">
    <nav class="pbl-nav">
      <a href="../index.html" class="pbl-logo">
        <img src="../images/ll_logo.webp" alt="LIKELION">
        <span>LIKELION</span>
        <span class="accent">PBL</span>
      </a>
      <ul class="pbl-nav-menu">
        <li><a href="missions.html">미션</a></li>
        <li><a href="my.html">내 현황</a></li>
      </ul>
      <div class="pbl-nav-actions"></div>
      <button class="pbl-hamburger"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <main class="pbl-main">
    <!-- Mission detail -->
    <div id="missionDetail">
      <div class="text-center text-muted"><span class="spinner"></span></div>
    </div>

    <!-- Submit form -->
    <div id="submitSection" class="hidden mt-3">
      <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:1rem;">과제 제출</h2>
      <form id="submitForm" class="pbl-card">
        <div id="dynamicFields"></div>
        <button type="submit" class="btn btn-primary btn-block mt-2">제출하기</button>
      </form>
    </div>

    <!-- Previous submissions -->
    <div id="submissionHistory" class="mt-3"></div>
  </main>

  <script src="js/pbl.js"></script>
  <script>
    requireAuth();
    const params = new URLSearchParams(location.search);
    const missionId = params.get('id');
    if (!missionId) location.href = 'missions.html';

    const user = getUser();

    (async () => {
      try {
        // Load mission detail
        const mission = await loadMissionDetail(missionId);
        const m = mission.mission || mission;
        document.getElementById('missionDetail').innerHTML = `
          <a href="missions.html" style="font-size:.85rem;color:var(--text-muted);">&larr; 미션 목록</a>
          <h1 class="pbl-page-title mt-1">${escapeHTML(m.title)}</h1>
          <p class="pbl-page-subtitle">${escapeHTML(m.description || '')}</p>
          ${m.checklist ? `<h3 style="font-size:1rem;font-weight:600;margin-bottom:.5rem;">체크리스트</h3>
          <ul class="checklist">${m.checklist.map(c => `<li>${escapeHTML(c)}</li>`).join('')}</ul>` : ''}
        `;

        // Determine submission type from mission or user track
        const submitType = m.submit_type || user.track;
        renderSubmitFields(submitType, document.getElementById('dynamicFields'));
        document.getElementById('submitSection').classList.remove('hidden');

        // Load previous submissions
        const subs = await loadMySubmissions(missionId);
        const list = subs.submissions || [];
        const historyEl = document.getElementById('submissionHistory');
        if (list.length > 0) {
          historyEl.innerHTML = `
            <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:1rem;">이전 제출 내역</h2>
            ${list.map(s => `
              <div class="submission-item">
                <div class="submission-item-header">
                  <span class="badge badge-${s.status}">${statusLabel(s.status)}</span>
                  <time>${new Date(s.created_at).toLocaleString('ko-KR')}</time>
                </div>
                ${s.ai_feedback ? `<div class="feedback-box"><strong>AI 피드백</strong><br>${escapeHTML(s.ai_feedback)}</div>` : ''}
                ${s.admin_feedback ? `<div class="feedback-box mt-1"><strong>운영진 피드백</strong><br>${escapeHTML(s.admin_feedback)}</div>` : ''}
              </div>
            `).join('')}
          `;
          // Hide form if max attempts reached (2) or passed
          const passedOrMax = list.some(s => s.status === 'passed') || list.length >= 2;
          if (passedOrMax) document.getElementById('submitSection').classList.add('hidden');
        }
      } catch (err) {
        document.getElementById('missionDetail').innerHTML = `<p class="text-muted">${escapeHTML(err.message)}</p>`;
      }
    })();

    // Submit handler
    document.getElementById('submitForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 제출 중...';
      try {
        await submitAssignment(missionId, e.target);
        showToast('success', '제출 완료!');
        setTimeout(() => location.reload(), 1000);
      } catch (err) {
        showToast('error', err.message || '제출 실패');
        btn.disabled = false;
        btn.textContent = '제출하기';
      }
    });
  </script>
</body>
</html>
