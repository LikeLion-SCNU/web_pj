<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운영진 대시보드 - SCNU LIKELION PBL</title>
  <link rel="icon" type="image/png" href="../../images/logo_og.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/pbl.css?v=4">
</head>
<body>

  <header class="pbl-header">
    <nav class="pbl-nav">
      <a href="/" class="pbl-logo">
        <img src="../../images/ll_logo.webp" alt="LIKELION">
        <span>LIKELION</span>
        <span class="accent">PBL</span>
      </a>
      <ul class="pbl-nav-menu">
        <li><a href="../missions">미션</a></li>
        <li><a href="../my">내 현황</a></li>
        <li><a href="dashboard" class="active admin-link">운영진</a></li>
      </ul>
      <div class="pbl-nav-actions"></div>
      <button class="pbl-hamburger"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <main class="pbl-main">
    <h1 class="pbl-page-title">운영진 대시보드</h1>

    <!-- Pending Users -->
    <div id="pendingUsersSection" style="display:none; margin-bottom:32px;">
      <h2 style="color:#FF7710; font-size:1.2rem; margin-bottom:16px;">
        <i class="fa-solid fa-user-clock"></i> 가입 승인 대기 (<span id="pendingUserCount">0</span>명)
      </h2>
      <div id="pendingUsersList" class="card-grid"></div>
    </div>

    <!-- Stats -->
    <div id="statsGrid" class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="statTotal">-</div><div class="stat-label">총 인원</div></div>
      <div class="stat-card"><div class="stat-value" id="statSubmissions">-</div><div class="stat-label">총 제출</div></div>
      <div class="stat-card"><div class="stat-value" id="statPassed">-</div><div class="stat-label">합격</div></div>
      <div class="stat-card"><div class="stat-value" id="statRejected">-</div><div class="stat-label">반려</div></div>
      <div class="stat-card"><div class="stat-value" id="statPending">-</div><div class="stat-label">대기</div></div>
    </div>

    <!-- Warnings -->
    <div id="warningsSection" style="display:none;"></div>

    <!-- User Management -->
    <div style="margin-bottom:32px;">
      <h2 style="font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:16px;">사용자 관리</h2>
      <div id="userManagementList" style="display:grid;gap:8px;"></div>
    </div>

    <!-- Progress Matrix -->
    <div style="margin-bottom:32px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="font-size:1.2rem;font-weight:700;color:#fff;">과제 현황</h2>
        <select id="matrixTrackFilter" class="form-select" style="width:auto;">
          <option value="">전체 트랙</option>
          <option value="planning">기획</option>
          <option value="design">디자인</option>
          <option value="frontend">프론트엔드</option>
          <option value="backend">백엔드</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table class="progress-matrix" id="progressMatrix">
          <thead><tr><th>이름</th><th>트랙</th><th>팀</th></tr></thead>
          <tbody><tr><td colspan="3" style="text-align:center;color:#888;">로딩중...</td></tr></tbody>
        </table>
      </div>
      <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:#888;">
        <span><span class="progress-cell progress-cell-passed" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></span> 합격</span>
        <span><span class="progress-cell progress-cell-pending" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></span> 대기</span>
        <span><span class="progress-cell progress-cell-reviewing" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></span> 검토중</span>
        <span><span class="progress-cell progress-cell-rejected" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></span> 반려</span>
        <span><span class="progress-cell progress-cell-missed" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></span> 미제출(마감)</span>
        <span><span class="progress-cell progress-cell-none" style="width:12px;height:12px;display:inline-block;vertical-align:middle;"></span> 미진행</span>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <select id="filterTrack" class="form-select">
        <option value="">전체 트랙</option>
        <option value="planning">기획</option>
        <option value="design">디자인</option>
        <option value="frontend">프론트엔드</option>
        <option value="backend">백엔드</option>
      </select>
      <input id="filterMission" type="number" class="form-input" placeholder="미션 번호" min="1" style="width:120px">
      <select id="filterStatus" class="form-select">
        <option value="">전체 상태</option>
        <option value="passed">합격</option>
        <option value="rejected">반려</option>
        <option value="pending">대기</option>
        <option value="reviewing">검토중</option>
      </select>
      <button class="btn btn-primary btn-sm" id="filterBtn">필터 적용</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table class="pbl-table">
        <thead>
          <tr>
            <th>이름</th>
            <th>트랙</th>
            <th>팀</th>
            <th>미션</th>
            <th>상태</th>
            <th>제출일</th>
          </tr>
        </thead>
        <tbody id="submissionTable">
          <tr><td colspan="6" class="text-center text-muted"><span class="spinner"></span></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">제출 상세</h3>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="../js/pbl.js?v=4"></script>
  <script>
    requireAdmin();

    // 이벤트 바인딩 (CSP 호환)
    document.getElementById('filterBtn').addEventListener('click', () => applyFilters());
    document.getElementById('modalCloseBtn').addEventListener('click', () => closeModal('detailModal'));

    const TRACK_LABELS = {planning:'기획', design:'디자인', frontend:'프론트엔드', backend:'백엔드'};

    // Load pending users
    async function loadPendingUsers() {
      try {
        const users = await fetchAPI('/admin/pending-users');
        const section = document.getElementById('pendingUsersSection');
        const list = document.getElementById('pendingUsersList');
        document.getElementById('pendingUserCount').textContent = users.length;

        if (users.length === 0) {
          section.style.display = 'none';
          return;
        }
        section.style.display = 'block';
        list.innerHTML = users.map(u => `
          <div class="card" style="padding:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
              <strong style="color:#fff;">${escapeHTML(u.name)}</strong>
              <span class="badge" style="margin-left:8px;">${u.generation}기</span>
              <br>
              <span style="color:#888; font-size:13px;">${escapeHTML(u.email)} · ${TRACK_LABELS[u.track] || u.track} · ${u.team ? u.team + '팀' : '미정'}</span>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-primary btn-sm btn-approve" data-uid="${u.id}" data-name="${escapeHTML(u.name)}">승인</button>
              <button class="btn btn-outline btn-sm btn-reject" style="color:#ff4444; border-color:#ff4444;" data-uid="${u.id}" data-name="${escapeHTML(u.name)}">거절</button>
            </div>
          </div>
        `).join('');

        // 이벤트 바인딩
        list.querySelectorAll('.btn-approve').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            handleApprove(btn.dataset.uid, btn.dataset.name);
          });
        });
        list.querySelectorAll('.btn-reject').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            handleReject(btn.dataset.uid, btn.dataset.name);
          });
        });
      } catch (err) {
        console.error('Pending users load error:', err);
      }
    }

    async function handleApprove(userId, name) {
      try {
        const res = await fetchAPI('/admin/users/' + userId + '/approve', { method: 'PATCH' });
        showToast('success', name + '님이 승인되었습니다.');
        loadPendingUsers();
        loadWarnings();
        loadMatrix('');
      } catch (err) { showToast('error', err.message); }
    }

    async function handleReject(userId, name) {
      try {
        const res = await fetchAPI('/admin/users/' + userId + '/reject', { method: 'PATCH' });
        showToast('success', name + '님의 가입이 거절되었습니다.');
        loadPendingUsers();
      } catch (err) { showToast('error', err.message); }
    }

    loadPendingUsers();

    // Load user management
    const ROLE_LABELS = {admin: '운영진', baby_lion: '아기사자', tester: '테스터'};
    const ROLE_COLORS = {admin: '#FF7710', baby_lion: '#888', tester: '#4ade80'};

    async function loadUserManagement() {
      try {
        var users = await fetchAPI('/admin/users');
        var container = document.getElementById('userManagementList');
        if (!users || users.length === 0) {
          container.innerHTML = '<p style="color:#888;">승인된 사용자가 없습니다.</p>';
          return;
        }
        container.innerHTML = users.map(function(u) {
          var roleLabel = '<span style="color:'+ROLE_COLORS[u.role]+';font-weight:600;">'+(ROLE_LABELS[u.role]||u.role)+'</span>';
          var selectHtml = '<select class="form-select role-select" data-uid="'+u.id+'" data-uname="'+escapeHTML(u.name)+'" style="font-size:.8rem;width:auto;padding:4px 8px;background:#111;color:#fff;border:1px solid #333;border-radius:6px;">'
            +'<option value="baby_lion"'+(u.role==='baby_lion'?' selected':'')+'>아기사자</option>'
            +'<option value="tester"'+(u.role==='tester'?' selected':'')+'>테스터</option>'
            +'<option value="admin"'+(u.role==='admin'?' selected':'')+'>운영진</option>'
            +'</select>';
          var deleteBtn = u.role !== 'admin'
            ? '<button type="button" class="btn-delete" data-uid="'+u.id+'" data-uname="'+escapeHTML(u.name)+'" style="font-size:.75rem;color:#f87171;border:1px solid #f87171;background:transparent;padding:6px 12px;border-radius:6px;margin-left:8px;cursor:pointer;position:relative;z-index:10;">삭제</button>'
            : '';
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#1a1a1a;border-radius:8px;">'
            +'<div><strong style="color:#fff;">'+escapeHTML(u.name)+'</strong> '+roleLabel
            +' <span style="color:#666;font-size:.8rem;margin-left:8px;">'+escapeHTML(u.email)+' · '+(TRACK_LABELS[u.track]||u.track)+' · '+(u.team?u.team+'팀':'')+'</span></div>'
            +'<div style="display:flex;align-items:center;">'+selectHtml+deleteBtn+'</div></div>';
        }).join('');

        container.querySelectorAll('.role-select').forEach(function(sel) {
          sel.addEventListener('change', function() {
            setUserRole(sel.dataset.uid, sel.dataset.uname, sel.value);
          });
        });
        container.querySelectorAll('.btn-delete').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            deleteUser(btn.dataset.uid, btn.dataset.uname);
          });
        });
      } catch (err) { console.error('User management error:', err); }
    }

    async function setUserRole(userId, name, role) {
      try {
        var res = await fetchAPI('/admin/users/' + userId + '/set-role?role=' + role, { method: 'PATCH' });
        showToast('success', res.message || (name + '님의 역할이 변경되었습니다.'));
        loadUserManagement();
      } catch (err) { showToast('error', err.message); }
    }

    async function deleteUser(userId, name) {
      if (!confirm(name + '님의 계정을 삭제하시겠습니까?\n제출 내역도 모두 삭제됩니다.')) return;
      try {
        var res = await fetchAPI('/admin/users/' + userId, { method: 'DELETE' });
        showToast('success', res.message || (name + '님이 삭제되었습니다.'));
        loadUserManagement();
        loadMatrix('');
      } catch (err) { showToast('error', err.message); }
    }

    loadUserManagement();

    // Load warnings
    async function loadWarnings() {
      try {
        const warnings = await fetchAPI('/admin/warnings');
        const section = document.getElementById('warningsSection');
        if (warnings.length === 0) { section.style.display = 'none'; return; }
        section.style.display = 'block';
        section.innerHTML = `
          <div class="warning-alert">
            <h3>⚠️ 미제출 경고 (2회 이상 미제출: ${warnings.length}명)</h3>
            ${warnings.map(w => `
              <div class="warning-alert-item">
                <strong>${escapeHTML(w.name)}</strong>
                <span style="color:#888;margin-left:8px;">${TRACK_LABELS[w.track] || w.track} · ${w.team ? w.team + '팀' : ''}</span>
                <span style="color:#f87171;margin-left:8px;">미제출 ${w.missed_count}회 (미션 ${w.missed_missions.join(', ')})</span>
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) { console.error('Warnings error:', err); }
    }
    loadWarnings();

    // Load progress matrix
    async function loadMatrix(track) {
      try {
        const qs = track ? '?track=' + track : '';
        const data = await fetchAPI('/admin/progress-matrix' + qs);
        const table = document.getElementById('progressMatrix');
        const maxMissions = 11; // M0 ~ M10
        let headerHtml = '<tr><th>이름</th><th>트랙</th><th>팀</th>';
        for (let i = 0; i <= 10; i++) headerHtml += '<th>M' + i + '</th>';
        headerHtml += '</tr>';
        table.querySelector('thead').innerHTML = headerHtml;

        if (data.length === 0) {
          table.querySelector('tbody').innerHTML = '<tr><td colspan="' + (maxMissions + 3) + '" style="text-align:center;color:#888;">데이터 없음</td></tr>';
          return;
        }
        table.querySelector('tbody').innerHTML = data.map(u => {
          let cells = '<td>' + escapeHTML(u.name) + '</td><td>' + (TRACK_LABELS[u.track] || u.track) + '</td><td>' + (u.team || '-') + '</td>';
          for (let i = 0; i < maxMissions; i++) {
            const ms = u.missions[i];
            const st = ms ? ms.status : 'upcoming';
            const cls = st === 'passed' ? 'passed' : st === 'pending' ? 'pending' : st === 'reviewing' ? 'reviewing' : st === 'rejected' ? 'rejected' : st === 'missed' ? 'missed' : 'none';
            cells += '<td><span class="progress-cell progress-cell-' + cls + '" title="미션 ' + (ms ? ms.number : i) + ': ' + st + '"></span></td>';
          }
          return '<tr>' + cells + '</tr>';
        }).join('');
      } catch (err) { console.error('Matrix error:', err); }
    }
    loadMatrix('');
    document.getElementById('matrixTrackFilter').addEventListener('change', function() { loadMatrix(this.value); });

    // Load stats
    (async () => {
      try {
        const stats = await loadAdminStats();
        const s = stats.stats || stats;
        document.getElementById('statTotal').textContent = s.total_users ?? '-';
        document.getElementById('statSubmissions').textContent = s.total_submissions ?? '-';
        document.getElementById('statPassed').textContent = s.passed_count ?? '-';
        document.getElementById('statRejected').textContent = s.rejected_count ?? '-';
        document.getElementById('statPending').textContent = s.pending_count ?? '-';
      } catch {}
    })();

    // Load submissions
    async function loadTable(params = {}) {
      const tbody = document.getElementById('submissionTable');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center"><span class="spinner"></span></td></tr>';
      try {
        const data = await loadAdminSubmissions(params);
        const list = Array.isArray(data) ? data : (data.submissions || []);
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">데이터 없음</td></tr>';
          return;
        }
        tbody.innerHTML = list.map((s, i) => `
          <tr class="clickable" data-idx="${i}">
            <td>${escapeHTML(s.user_name)}</td>
            <td>${escapeHTML(s.track)}</td>
            <td>${s.team || '-'}</td>
            <td>미션 ${s.mission_number}</td>
            <td><span class="badge badge-${s.status}">${statusLabel(s.status)}</span></td>
            <td>${new Date(s.submitted_at).toLocaleDateString('ko-KR')}</td>
          </tr>
        `).join('');
        // 행 클릭 이벤트 바인딩
        tbody.querySelectorAll('tr[data-idx]').forEach(tr => {
          tr.addEventListener('click', () => showDetail(list[parseInt(tr.dataset.idx)]));
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-muted">${escapeHTML(err.message)}</td></tr>`;
      }
    }
    loadTable();

    function applyFilters() {
      const params = {};
      const track = document.getElementById('filterTrack').value;
      const mission = document.getElementById('filterMission').value;
      const status = document.getElementById('filterStatus').value;
      if (track) params.track = track;
      if (mission) params.mission_number = mission;
      if (status) params.status = status;
      loadTable(params);
    }

    function showDetail(s) {
      document.getElementById('modalTitle').textContent = `${s.user_name} - 미션 ${s.mission_number}`;
      document.getElementById('modalBody').innerHTML = `
        <div style="margin-bottom:1rem">
          <span class="badge badge-${s.status}">${statusLabel(s.status)}</span>
          <span class="text-muted" style="margin-left:.5rem;font-size:.8rem">${new Date(s.created_at).toLocaleString('ko-KR')}</span>
        </div>
        ${s.github_url ? `<p><strong>GitHub:</strong> <a href="${escapeHTML(s.github_url)}" target="_blank">${escapeHTML(s.github_url)}</a></p>` : ''}
        ${s.deploy_url ? `<p><strong>배포:</strong> <a href="${escapeHTML(s.deploy_url)}" target="_blank">${escapeHTML(s.deploy_url)}</a></p>` : ''}
        ${s.figma_url ? `<p><strong>Figma:</strong> <a href="${escapeHTML(s.figma_url)}" target="_blank">${escapeHTML(s.figma_url)}</a></p>` : ''}
        ${s.description ? `<p><strong>설명:</strong> ${escapeHTML(s.description)}</p>` : ''}
        ${s.ai_score != null ? `<p><strong>AI 점수:</strong> ${s.ai_score}/100</p>` : ''}
        ${s.ai_feedback ? `<div class="feedback-box"><strong>AI 피드백</strong><br>${escapeHTML(s.ai_feedback)}</div>` : ''}
      `;
      const footer = document.getElementById('modalFooter');
      if (s.status === 'pending' || s.status === 'reviewing') {
        footer.innerHTML = `
          <div style="display:flex;gap:8px;align-items:center;width:100%;flex-wrap:wrap;">
            <input type="text" id="modalComment" placeholder="사유 입력 (선택)" style="flex:1;min-width:150px;padding:8px 12px;background:#111;color:#fff;border:1px solid #333;border-radius:6px;font-size:.85rem;">
            <button type="button" id="modalApproveBtn" style="padding:8px 16px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">합격</button>
            <button type="button" id="modalRejectBtn" style="padding:8px 16px;background:#ef4444;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;">반려</button>
          </div>
        `;
        document.getElementById('modalApproveBtn').addEventListener('click', function() { handleSubmissionReview(s.id, true); });
        document.getElementById('modalRejectBtn').addEventListener('click', function() { handleSubmissionReview(s.id, false); });
      } else {
        footer.innerHTML = '';
      }
      openModal('detailModal');
    }

    async function handleSubmissionReview(id, approved) {
      var comment = document.getElementById('modalComment').value.trim() || (approved ? '합격' : '반려');
      if (!approved && !document.getElementById('modalComment').value.trim()) {
        if (!confirm('반려 사유 없이 반려하시겠습니까?')) return;
      }
      try {
        await adminReviewSubmission(id, approved, comment);
        showToast('success', approved ? '합격 처리 완료' : '반려 처리 완료');
        closeModal('detailModal');
        applyFilters();
        loadMatrix(document.getElementById('matrixTrackFilter').value);
      } catch (err) { showToast('error', err.message); }
    }
  </script>
</body>
</html>
