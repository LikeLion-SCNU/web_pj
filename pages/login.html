<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - SCNU LIKELION PBL</title>
  <link rel="icon" type="image/png" href="../images/logo_og.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/pbl.css?v=4">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <!-- Header -->
  <header class="pbl-header">
    <nav class="pbl-nav">
      <a href="/" class="pbl-logo">
        <img src="../images/ll_logo.webp" alt="LIKELION">
        <span>LIKELION</span>
        <span class="accent">PBL</span>
      </a>
      <ul class="pbl-nav-menu">
        <li><a href="missions">미션</a></li>
        <li><a href="my">내 현황</a></li>
      </ul>
      <div class="pbl-nav-actions"></div>
      <button class="pbl-hamburger"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <main class="pbl-main">
    <div class="auth-container">
      <div class="auth-card">
        <div class="tabs">
          <button class="tab-btn active" data-tab="tab-login">로그인</button>
          <button class="tab-btn" data-tab="tab-register">회원가입</button>
        </div>

        <!-- Login -->
        <div id="tab-login" class="tab-panel active">
          <form id="loginForm" onsubmit="handleLoginWithTurnstile(event)">
            <div class="form-group">
              <label class="form-label">이메일</label>
              <input type="email" name="email" class="form-input" placeholder="example@scnu.ac.kr" required>
            </div>
            <div class="form-group">
              <label class="form-label">비밀번호</label>
              <input type="password" name="password" class="form-input" placeholder="비밀번호" required>
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAACwpiwkvxNk-r1Tw" data-theme="dark" data-callback="onLoginTurnstile" style="margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary btn-block">로그인</button>
          </form>
        </div>

        <!-- Register Step 1: Info -->
        <div id="tab-register" class="tab-panel">
          <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
              <label class="form-label">이메일</label>
              <input type="email" name="email" class="form-input" placeholder="example@scnu.ac.kr" required>
            </div>
            <div class="form-group">
              <label class="form-label">비밀번호</label>
              <input type="password" name="password" class="form-input" placeholder="8자 이상" minlength="8" required>
            </div>
            <div class="form-group">
              <label class="form-label">이름</label>
              <input type="text" name="name" class="form-input" placeholder="홍길동" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">트랙</label>
                <select name="track" class="form-select" required>
                  <option value="">트랙 선택</option>
                  <option value="planning">기획</option>
                  <option value="design">디자인</option>
                  <option value="frontend">프론트엔드</option>
                  <option value="backend">백엔드</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">기수</label>
                <select name="generation" class="form-select" required>
                  <option value="14">14기</option>
                  <option value="15">15기</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">팀</label>
              <select name="team" class="form-select" required>
                <option value="">팀 선택</option>
                <option value="1">1팀</option>
                <option value="2">2팀</option>
                <option value="3">3팀</option>
                <option value="4">4팀</option>
                <option value="5">5팀</option>
              </select>
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAACwpiwkvxNk-r1Tw" data-theme="dark" data-callback="onRegisterTurnstile" style="margin-bottom:12px;"></div>
            <button type="submit" class="btn btn-primary btn-block">인증 코드 발송</button>
          </form>
        </div>

        <!-- Register Step 2: Email Verify -->
        <div id="tab-verify" class="tab-panel" style="display:none;">
          <div style="text-align:center; margin-bottom:24px;">
            <i class="fa-regular fa-envelope" style="font-size:48px; color:#FF7710; margin-bottom:16px;"></i>
            <h3 style="color:#fff; margin-bottom:8px;">이메일 인증</h3>
            <p style="color:#888;" id="verifyEmailText">이메일로 전송된 6자리 인증 코드를 입력해주세요.</p>
          </div>
          <form id="verifyForm" onsubmit="handleVerifyEmail(event)">
            <input type="hidden" name="email" id="verifyEmail">
            <div class="form-group">
              <label class="form-label">인증 코드</label>
              <input type="text" name="code" class="form-input" placeholder="6자리 숫자" maxlength="6" pattern="\d{6}" style="text-align:center; font-size:24px; letter-spacing:8px;" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">인증 확인</button>
          </form>
          <p style="color:#888; text-align:center; margin-top:16px; font-size:13px;">
            인증 코드가 도착하지 않았나요? <a href="#" onclick="handleResendCode(event)" style="color:#FF7710;">재전송</a>
          </p>
        </div>

        <!-- Register Step 3: Waiting -->
        <div id="tab-waiting" class="tab-panel" style="display:none;">
          <div style="text-align:center; padding:32px 0;">
            <i class="fa-solid fa-clock" style="font-size:48px; color:#FF7710; margin-bottom:16px;"></i>
            <h3 style="color:#fff; margin-bottom:8px;">승인 대기 중</h3>
            <p style="color:#888;">이메일 인증이 완료되었습니다!<br>운영진의 승인 후 로그인할 수 있습니다.</p>
            <a href="login" class="btn btn-outline" style="margin-top:24px;">로그인 페이지로</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/pbl.js?v=4"></script>
  <script>
    let registerEmail = '';
    let registerPassword = '';
    let loginTurnstileToken = '';
    let registerTurnstileToken = '';
    function onLoginTurnstile(token) { loginTurnstileToken = token; }
    function onRegisterTurnstile(token) { registerTurnstileToken = token; }

    async function handleLoginWithTurnstile(e) {
      e.preventDefault();
      var form = e.target;
      var email = form.querySelector('[name="email"]').value.trim();
      var password = form.querySelector('[name="password"]').value;
      try {
        var data = await fetchAPI('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: email, password: password, turnstile_token: loginTurnstileToken }),
        });
        localStorage.setItem('pbl_token', data.access_token);
        var user = await fetchAPI('/auth/me');
        localStorage.setItem('pbl_user', JSON.stringify(user));
        showToast('success', '로그인 성공!');
        setTimeout(function() { window.location.href = '/pages/missions'; }, 500);
      } catch (err) {
        showToast('error', err.message || '로그인 실패');
        if (typeof turnstile !== 'undefined') turnstile.reset();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        email: form.email.value,
        password: form.password.value,
        name: form.name.value,
        track: form.track.value,
        generation: parseInt(form.generation.value),
        team: parseInt(form.team.value),
        turnstile_token: registerTurnstileToken,
      };

      registerEmail = data.email;
      registerPassword = data.password;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await res.json();
        if (!res.ok) {
          if (res.status === 409) {
            showToast('error', '이미 가입된 이메일입니다. 로그인 탭에서 로그인하거나, 인증이 안 됐다면 로그인 후 인증 코드를 재전송하세요.');
          } else {
            showToast('error', result.detail || '회원가입 실패');
          }
          return;
        }

        // Show verify step
        document.getElementById('verifyEmail').value = data.email;
        document.getElementById('verifyEmailText').textContent =
          `${data.email}로 전송된 6자리 인증 코드를 입력해주세요.`;
        document.getElementById('tab-register').style.display = 'none';
        document.getElementById('tab-verify').style.display = 'block';
        document.querySelector('.tabs').style.display = 'none';
      } catch (err) {
        showToast('error', err.message || '네트워크 오류');
      }
    }

    async function handleVerifyEmail(e) {
      e.preventDefault();
      const form = e.target;
      try {
        const res = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, code: form.code.value }),
        });
        const result = await res.json();
        if (!res.ok) {
          showToast('error', result.detail || '인증 실패');
          return;
        }

        // Show waiting step
        document.getElementById('tab-verify').style.display = 'none';
        document.getElementById('tab-waiting').style.display = 'block';
      } catch (err) {
        showToast('error', err.message || '네트워크 오류');
      }
    }

    async function handleResendCode(e) {
      e.preventDefault();
      if (!registerEmail || !registerPassword) {
        showToast('error', '회원가입 정보가 없습니다. 페이지를 새로고침 후 다시 시도해주세요.');
        return;
      }
      try {
        const res = await fetch('/api/auth/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: registerEmail, password: registerPassword }),
        });
        const result = await res.json();
        if (!res.ok) {
          showToast('error', result.detail || '재전송 실패');
          return;
        }
        showToast('success', '인증 코드가 재전송되었습니다.');
      } catch (err) {
        showToast('error', err.message || '네트워크 오류');
      }
    }
  </script>
</body>
</html>
